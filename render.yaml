services:
  - type: web
    name: mystore
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mystore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_OWNER_EMAIL
        value: admin@mystore.test
      - key: BOOTSTRAP_OWNER_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_SHOP_NAME
        value: MyStore
databases:
  - name: mystore-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    ipAllowList: []
