name: MyStore checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mystore
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mystore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mystore -d mystore_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mystore:test-only@localhost:5432/mystore_test
      SESSION_SECRET: ci-only-randomness-not-production-secret-00001
      WEB_ORIGINS: http://localhost:5173,http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Server-rendered public HTTP checks
        run: node scripts/storefront-ssr-test.cjs
      - run: npm test
      - run: docker compose --env-file .env.example config --quiet
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build production image
        run: docker build -t mystore-api:ci .
      - name: Create isolated smoke and browser databases
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.TEST_DATABASE_URL});await c.connect();await c.query('CREATE DATABASE mystore_smoke');await c.query('CREATE DATABASE mystore_browser_test');await c.end()})().catch(e=>{console.error(e.message);process.exit(1)})"
      - name: Seed smoke database
        env:
          DATABASE_URL: postgres://mystore:test-only@localhost:5432/mystore_smoke
          ALLOW_DEMO_SEED: 'yes'
          SEED_PASSWORD: ci-only-smoke-password
          NODE_ENV: development
        run: |
          node apps/api/dist/scripts/migrate.js
          node apps/api/dist/scripts/seed.js
      - name: Check image via HTTP
        env:
          SMOKE_PASSWORD: ci-only-smoke-password
        run: |
          docker run -d --name mystore-api-ci --network host -e DATABASE_URL=postgres://mystore:test-only@localhost:5432/mystore_smoke -e SESSION_SECRET="$SESSION_SECRET" -e WEB_ORIGINS="$WEB_ORIGINS" mystore-api:ci
          node scripts/smoke.cjs
          docker stop mystore-api-ci
      - name: Browser flow against production image
        env:
          TEST_DATABASE_URL: postgres://mystore:test-only@localhost:5432/mystore_browser_test
          E2E_BASE_URL: http://localhost:3001
        run: |
          docker run -d --name mystore-browser-ci --network host -e DATABASE_URL="$TEST_DATABASE_URL" -e SESSION_SECRET="$SESSION_SECRET" -e WEB_ORIGINS="$WEB_ORIGINS" mystore-api:ci
          node -e "(async()=>{for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:3001/api/auth/me');if(r.status===401)return}catch{}await new Promise(r=>setTimeout(r,500))}throw new Error('API not ready')})().catch(e=>{console.error(e.message);process.exit(1)})"
          npm run test:e2e --workspace apps/web
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: apps/web/test-results
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs mystore-api-ci || true
          docker logs mystore-browser-ci || true
          docker rm -f mystore-api-ci mystore-browser-ci || true
