name: Format diagnostic
on:
  push:
    branches:
      - feat/simplify-store-workflows-20261031
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Format files and show patch
        run: |
          npx prettier --write apps/web/src/layout/workspace-navigation.test.ts apps/web/src/layout/workspace-navigation.ts apps/web/src/receiving/ReceivingPage.tsx
          git diff -- apps/web/src/layout/workspace-navigation.test.ts apps/web/src/layout/workspace-navigation.ts apps/web/src/receiving/ReceivingPage.tsx
