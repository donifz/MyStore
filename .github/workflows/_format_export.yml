name: Temporary format export
on:
  pull_request:
    branches:
      - main
    paths:
      - apps/web/src/platform/AdminPage.tsx
      - apps/web/src/platform/AdminPage.test.tsx
      - .github/workflows/_format_export.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and print files
        run: |
          npx prettier --write apps/web/src/platform/AdminPage.tsx apps/web/src/platform/AdminPage.test.tsx
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['apps/web/src/platform/AdminPage.tsx', 'apps/web/src/platform/AdminPage.test.tsx']) {
            console.log('FORMATEXPORT_BEGIN ' + name);
            const chars = Array.from(fs.readFileSync(name, 'utf8'));
            for (let i = 0; i < chars.length; i += 500) {
              console.log(JSON.stringify(chars.slice(i, i + 500).join('')));
            }
            console.log('FORMATEXPORT_END ' + name);
          }
          NODE
