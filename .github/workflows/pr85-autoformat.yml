name: Autoformat feat/reports-stock-valuation-overview-20261107
on:
  push:
    branches: [feat/reports-stock-valuation-overview-20261107]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply Prettier and commit changes
        run: |
          npx prettier --write apps/web/src/reports/ReportsPage.tsx apps/web/src/reports/ReportsPage.test.tsx
          npm run format:check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/reports/ReportsPage.tsx apps/web/src/reports/ReportsPage.test.tsx
            git commit -m "style: apply Prettier to PR changes"
            git push
          fi
