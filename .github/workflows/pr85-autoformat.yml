name: Autoformat loyalty code
on:
  push:
    branches: [feat/loyalty-qr-checkout-20261107]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply Prettier and commit changes
        run: |
          npx prettier --write apps/api/src/pos/loyalty.service.ts apps/api/src/pos/pos-sales.controller.ts apps/api/src/pos/pos-sales.service.ts apps/web/src/customers/BuyerPortalPage.tsx apps/web/src/pos/LoyaltyCheckout.tsx apps/web/src/reports/ReportsPage.tsx
          npm run format:check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/pos/loyalty.service.ts apps/api/src/pos/pos-sales.controller.ts apps/api/src/pos/pos-sales.service.ts apps/web/src/customers/BuyerPortalPage.tsx apps/web/src/pos/LoyaltyCheckout.tsx apps/web/src/reports/ReportsPage.tsx
            git commit -m "style: format loyalty code"
            git push
          fi
