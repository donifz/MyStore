name: Temporary label formatting output
on:
  push:
    branches: [fix/label-print-30x20]
    paths: [.github/workflows/temporary-label-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/web/src/catalog/BarcodeLabel.tsx apps/web/src/catalog/BarcodeLabelsPage.tsx apps/web/src/catalog/BarcodeLabel.test.tsx
      - name: Emit formatted files
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['apps/web/src/catalog/BarcodeLabel.tsx', 'apps/web/src/catalog/BarcodeLabelsPage.tsx', 'apps/web/src/catalog/BarcodeLabel.test.tsx'];
          console.log('FORMATTED_FILES_JSON=' + JSON.stringify(Object.fromEntries(files.map(f => [f, fs.readFileSync(f, 'utf8')]))));
          NODE
