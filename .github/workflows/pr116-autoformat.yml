name: Format PR 116 only
on:
  push:
    branches: [feat/pos-credit-customer-unified-ux-20261107]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Format changed files and commit
        run: |
          npx prettier --write apps/web/src/pos/CreditFields.tsx apps/web/src/pos/PosBuyerInvitation.tsx apps/web/src/pos/PaymentBottomSheet.tsx apps/web/src/pos/SalePage.tsx apps/web/src/pos/credit-fields.css apps/api/src/customers/buyer-auth.service.ts apps/api/src/customers/buyer-telegram.service.ts apps/api/src/customers/shop-customers.service.ts apps/api/test/buyer-customers.e2e-spec.ts apps/api/test/buyer-telegram.e2e-spec.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/pos/CreditFields.tsx apps/web/src/pos/PosBuyerInvitation.tsx apps/web/src/pos/PaymentBottomSheet.tsx apps/web/src/pos/SalePage.tsx apps/web/src/pos/credit-fields.css apps/api/src/customers/buyer-auth.service.ts apps/api/src/customers/buyer-telegram.service.ts apps/api/src/customers/shop-customers.service.ts apps/api/test/buyer-customers.e2e-spec.ts apps/api/test/buyer-telegram.e2e-spec.ts
            git commit -m "style: format PR 116 invitation changes"
            git push
          fi
