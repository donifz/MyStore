name: Format POS layout PR once
on:
  push:
    branches: [fix/pos-payment-options-collapsed-mobile]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files and push
        run: |
          npx prettier --write apps/web/e2e/seller.spec.ts apps/web/src/pos/PaymentBottomSheet.tsx apps/web/src/pos/SalePage.tsx apps/web/src/pos/payment-bottom-sheet.css apps/web/src/styles.css
          npm run format:check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/e2e/seller.spec.ts apps/web/src/pos/PaymentBottomSheet.tsx apps/web/src/pos/SalePage.tsx apps/web/src/pos/payment-bottom-sheet.css apps/web/src/styles.css
            git commit -m "style(pos): apply project Prettier formatting"
            git fetch origin fix/pos-payment-options-collapsed-mobile
            git rebase origin/fix/pos-payment-options-collapsed-mobile
            git push
          fi
